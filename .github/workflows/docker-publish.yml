name: Build Docker Images

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: fraud_detector
            context: ./fraud_detector
          - service: transaction_simulator
            context: ./transaction_simulator
          - service: scoring_writer
            context: ./scoring_writer
          - service: data_loader
            context: ./data_loader
          - service: airflow
            context: ./airflow
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: fraud-monitoring-hw11-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
